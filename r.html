<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="shortcut icon" href="styles/redirect-favicon.png">
<title>Redirecting...</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f7fb;
}

.card{
  background:white;
  padding:40px 50px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  text-align:center;
  max-width:420px;
  width:90%;
}

.card h1{
  margin:0 0 10px;
  font-size:22px;
  color:#222;
}

.card p{
  margin:0 0 20px;
  color:#666;
  font-size:14px;
}

.btn{
  display:inline-block;
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:500;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.btn-danger{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

#timer{
  margin-top:15px;
  color:#666;
  font-size:14px;
}
</style>

<script>
(function () {

  const API_URL =
    "https://raw.githubusercontent.com/allanhu100/public/main/redirects.json";

  function showError(
    title = "Error",
    message = "The link may be invalid or expired."
  ) {
    document.body.innerHTML = `
      <div class="card">
        <h1>${title}</h1>
        <p>${message}</p>
      </div>
    `;
  }

  const pathParts =
    window.location.pathname.split("/").filter(Boolean);

  const params =
    new URLSearchParams(window.location.search);

  if (pathParts.length !== 1 || pathParts[0] !== "r") {
    showError("Invalid URL");
    return;
  }

  const id = params.get("id");

  if (!id) {
    showError("Missing ID");
    return;
  }

  const validIdPattern = /^[a-z0-9_-]{1,35}$/i;

  if (!validIdPattern.test(id)) {
    showError("Invalid ID");
    return;
  }

  (async () => {
    try {

      const response = await fetch(API_URL);
      if (!response.ok) throw new Error("Fetch failed");

      const data = await response.json();

      const entry = data.find(item => item.id === id);

      if (!entry) {
        showError("Not Found", "No redirect exists for that ID.");
        return;
      }

      const url = entry.url;
      const expiry = entry.expiry;
      const preview = entry.preview === true;

      if (!url) {
        showError("Invalid Entry", "Missing URL.");
        return;
      }

      if (expiry) {
        const expDate = new Date(expiry);

        if (!isNaN(expDate) && Date.now() > expDate.getTime()) {
          showError("Expired", "This redirect has expired.");
          return;
        }
      }

      if (!preview) {
        window.location.href = url;
        return;
      }

      document.body.innerHTML = `
        <div class="card">
          <h1>Redirect Notice</h1>

          <p>You are being redirected to:</p>

          <p style="word-break:break-word;">
            ${url}
          </p>

          <button id="go" class="btn">Continue</button>
          <button id="cancel" class="btn btn-danger">Cancel</button>

          <div id="timer">
            Redirecting in 10 seconds...
          </div>
        </div>
      `;

      document.getElementById("go").onclick = () => {
        window.location.href = url;
      };

      document.getElementById("cancel").onclick = () => {
        window.location.href = "/";
      };

      let seconds = 10;
      const timer = document.getElementById("timer");

      const interval = setInterval(() => {
        seconds--;

        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = url;
          return;
        }

        timer.textContent =
          `Redirecting in ${seconds} seconds...`;

      }, 1000);

    } catch (err) {
      console.error(err);
      showError("Redirect Failed", "Unable to load redirect data.");
    }
  })();

})();
</script>
</head>

<body>
<div class="card">
  <h1>Redirecting...</h1>
  <p>Please wait while we find your link.</p>
</div>
</body>
</html>
