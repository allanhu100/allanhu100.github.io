<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="shortcut icon" href="styles/redirect-favicon.png">
<title>Redirecting...</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f7fb;
}

.card{
  background:white;
  padding:40px 50px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  text-align:center;
  max-width:420px;
  width:90%;
}

.card h1{
  margin:0 0 10px;
  font-size:22px;
  color:#222;
}

.card p{
  margin:0 0 20px;
  color:#666;
  font-size:14px;
}

.btn{
  display:inline-block;
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-weight:500;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.btn-danger{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

#timer{
  margin-top:15px;
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>
<div class="card">
  <h1>Redirecting...</h1>
  <p>Please wait while we find your link.</p>
</div>

<script>
(function () {

  const API_URL =
    "https://raw.githubusercontent.com/allanhu100/public/main/redirects.json";

  function showError(
    title = "Error",
    message = "The link may be invalid or expired."
  ) {
    document.body.innerHTML = `
      <div class="card">
        <h1>${title}</h1>
        <p>${message}</p>
      </div>
    `;
  }

  console.log("=== REDIRECT DEBUG START ===");
  console.log("href:", window.location.href);
  console.log("pathname:", window.location.pathname);
  console.log("search:", window.location.search);

  const pathParts =
    window.location.pathname.split("/").filter(Boolean);

  console.log("pathParts:", pathParts);

  const params =
    new URLSearchParams(window.location.search);

  const id = params.get("id");

  console.log("id:", id);

  if (pathParts.length !== 1 || pathParts[0] !== "r") {
    console.error("Route validation failed");
    showError("Invalid URL");
    return;
  }

  if (!id) {
    console.error("Missing id parameter");
    showError("Missing ID");
    return;
  }

  const validIdPattern = /^[a-z0-9_-]{1,35}$/i;

  console.log("id valid:", validIdPattern.test(id));

  if (!validIdPattern.test(id)) {
    console.error("ID failed regex validation");
    showError("Invalid ID", "The provided ID has an invalid syntax.");
    return;
  }

  (async () => {
    try {

      console.log("Fetching:", API_URL);

      const response = await fetch(API_URL);

      console.log("Fetch response:", response);
      console.log("Fetch status:", response.status);
      console.log("Fetch ok:", response.ok);

      if (!response.ok) {
        throw new Error(`Fetch failed (${response.status})`);
      }

      const data = await response.json();

      console.log("JSON loaded:");
      console.log(data);
      console.log("Array:", Array.isArray(data));
      console.log("Length:", data.length);

      const entry = data.find(item => item.id === id);

      console.log("Matched entry:");
      console.log(entry);

      if (!entry) {
        console.error("No matching redirect found");
        showError("Not Found", "No redirect exists for that ID.");
        return;
      }

      const url = entry.url;
      const expiry = entry.expiry;
      const preview = entry.preview === true;

      console.log("url:", url);
      console.log("expiry:", expiry);
      console.log("preview:", preview);

      if (!url) {
        console.error("Entry missing URL");
        showError("Invalid Entry", "Missing URL.");
        return;
      }

      if (expiry) {
        const expDate = new Date(expiry);

        console.log("Parsed expiry:", expDate);
        console.log("Expiry timestamp:", expDate.getTime());

        if (!isNaN(expDate) && Date.now() > expDate.getTime()) {
          console.error("Redirect expired");
          showError("Expired", "This redirect has expired.");
          return;
        }
      }

      if (!preview) {
        console.log("Redirecting immediately to:", url);

        try {
          const testUrl = new URL(url);
          console.log("URL validation passed:", testUrl.href);
        } catch (urlErr) {
          console.error("URL validation failed:", urlErr);
        }

        window.location.href = url;
        return;
      }

      console.log("Showing preview page");

      document.body.innerHTML = `
        <div class="card">
          <h1>Redirect Notice</h1>
          <p>You are being redirected to:</p>
          <p style="word-break:break-word;">${url}</p>
          <button id="go" class="btn">Continue</button>
          <button id="cancel" class="btn btn-danger">Cancel</button>
          <div id="timer">Redirecting in 10 seconds...</div>
        </div>
      `;

      document.getElementById("go").onclick = () => {
        console.log("Continue clicked");
        window.location.href = url;
      };

      document.getElementById("cancel").onclick = () => {
        console.log("Cancel clicked");
        window.location.href = "/";
      };

      let seconds = 10;
      const timer = document.getElementById("timer");

      const interval = setInterval(() => {
        seconds--;

        console.log("Countdown:", seconds);

        if (seconds <= 0) {
          clearInterval(interval);
          console.log("Countdown complete, redirecting");
          window.location.href = url;
          return;
        }

        timer.textContent =
          `Redirecting in ${seconds} seconds...`;

      }, 1000);

    } catch (err) {

      console.error("=== ERROR CAUGHT ===");
      console.error("Name:", err.name);
      console.error("Message:", err.message);
      console.error("Stack:", err.stack);
      console.error("Full object:", err);

      showError(
        err.name || "Redirect Failed",
        err.message || "Unable to load redirect data."
      );
    }
  })();

})();
</script>
</body>
</html>
